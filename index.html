<!doctype html>
<html lang="en" style="background: transparent;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusicVault</title>
    <script>
      if (!window.__TAURI_INTERNALS__) {
        const mockTracks = [
          {
            id: 'mock-1',
            title: 'Dil Mein Ho Tum (From "Cheat India")',
            artist: 'Armaan Malik, Rochak Kohli, Bappi Lahiri',
            album: 'Dil Mein Ho Tum',
            duration: 346,
            file_path: 'C:/Music/Dil Mein Ho Tum.mp3',
            cover_art: null,
            track_number: 1,
            genre: 'Bollywood',
            year: 2019
          },
          {
            id: 'mock-2',
            title: 'Pehla Pyaar',
            artist: 'Armaan Malik, Vishal Mishra',
            album: 'Kabir Singh',
            duration: 278,
            file_path: 'C:/Music/Pehla Pyaar.mp3',
            cover_art: null,
            track_number: 2,
            genre: 'Bollywood',
            year: 2019
          },
          {
            id: 'mock-3',
            title: 'Bol Do Na Zara',
            artist: 'Armaan Malik, Amaal Mallik',
            album: 'Azhar',
            duration: 329,
            file_path: 'C:/Music/Bol Do Na Zara.mp3',
            cover_art: null,
            track_number: 3,
            genre: 'Bollywood',
            year: 2016
          },
          {
            id: 'mock-4',
            title: 'Zameen',
            artist: 'Aryan Singh',
            album: 'Zameen - Single',
            duration: 190,
            file_path: 'C:/Music/Aryan Singh - Zameen.mp3',
            cover_art: null,
            track_number: 4,
            genre: 'Indie',
            year: 2023
          }
        ];

        window.__TAURI_INTERNALS__ = {
          metadata: {
            currentWindow: { label: 'main' },
            currentWebview: { label: 'main' },
            windows: [{ label: 'main' }],
            webviews: [{ label: 'main' }]
          },
          invoke: async (cmd, args) => {
            if (cmd === 'scan_library') return mockTracks;
            if (cmd === 'get_current_settings') return null;
            if (cmd === 'get_system_volume') return 0.8;
            if (cmd === 'is_maximized') return false;
            if (cmd === 'search_spotify') {
              const q = encodeURIComponent(args?.query || '');
              const cc = args?.country || 'IN';
              try {
                const res = await fetch(`https://itunes.apple.com/search?term=${q}&media=music&entity=song&limit=25&country=${cc}`).then(r => r.json());
                return (res.results || []).map(item => ({
                  track_name: item.trackName,
                  artist_name: item.artistName,
                  album_name: item.collectionName || 'Unknown Album',
                  preview_url: item.previewUrl,
                  artwork_url: item.artworkUrl100 ? item.artworkUrl100.replace('100x100', '600x600') : null,
                  duration_ms: item.trackTimeMillis || 0,
                  track_url: item.trackViewUrl
                }));
              } catch {
                return [];
              }
            }
            return null;
          },
          transformCallback: () => 1,
          ipc: () => {}
        };

        window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
          unregisterListener: () => {}
        };
      }
    </script>
  </head>

  <body oncontextmenu="return false;" style="background: transparent;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
