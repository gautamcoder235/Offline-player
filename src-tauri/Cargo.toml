[package]
name = "offline-player"
version = "0.1.0"
description = "Offline Player Desktop App"
authors = ["Gautam"]
edition = "2021"

[lib]
name = "offline_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
base64 = "0.22"
lofty = "0.21"
tiny_http = "0.12"
percent-encoding = "2.3"
sha2 = "0.11.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
